
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 기본 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽 검색창과 오른쪽 지도로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 360px;
      min-width: 300px;
      padding: 24px 20px;
      border-right: 1px solid #ddd;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    #keyword {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      cursor: pointer;
    }

    button:hover {
      background: #f4dc00;
    }

    #locationButton {
      background: #f2f2f2;
    }

    #status {
      margin: 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #results {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 15px 5px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #f8f8f8;
    }

    .place-name {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .place-address {
      margin: 0 0 5px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .place-phone {
      margin: 0;
      color: #888;
      font-size: 12px;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #f3f3f3;
    }

    /* 모바일 화면 대응 */
    @media (max-width: 650px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 45%;
        padding: 14px;
      }

      .map-area {
        height: 55%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 장소 검색 및 결과 -->
    <aside class="sidebar">
      <h1>장소 검색</h1>

      <form class="search-form" id="searchForm">
        <input
          id="keyword"
          type="text"
          placeholder="카페, 맛집, 도서관 검색"
          autocomplete="off"
        >
        <button type="submit">검색</button>
      </form>

      <button type="button" id="locationButton">
        현재 위치로 이동
      </button>

      <p id="status" role="status">지도를 불러오는 중입니다.</p>

      <div id="results"></div>
    </aside>

    <!-- 오른쪽: 카카오맵 -->
    <main class="map-area">
      <div id="map"></div>
    </main>

  </div>

  <script>
    // 카카오 JavaScript 키
    const kakaoKey = "d976377df53252ce86ff34608c35d309";

    // SDK가 로드되지 않았을 때 오류를 표시합니다.
    const statusElement = document.getElementById("status");

    // 카카오맵 SDK를 비동기 방식으로 불러옵니다.
    const script = document.createElement("script");

    script.src =
      "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
      encodeURIComponent(kakaoKey) +
      "&libraries=services&autoload=false";

    // SDK 파일 로드가 끝난 뒤 지도 라이브러리를 초기화합니다.
    script.onload = function () {
      kakao.maps.load(function () {
        initializeApp();
      });
    };

    // SDK 로드 실패 시 안내합니다.
    script.onerror = function () {
      statusElement.textContent =
        "지도 로드에 실패했습니다. JavaScript 키와 웹 플랫폼 설정을 확인해 주세요.";
    };

    document.head.appendChild(script);

    // 카카오맵 준비가 완료된 다음 앱을 실행합니다.
    function initializeApp() {
      const mapContainer = document.getElementById("map");
      const searchForm = document.getElementById("searchForm");
      const keywordInput = document.getElementById("keyword");
      const resultsElement = document.getElementById("results");
      const locationButton = document.getElementById("locationButton");

      // 현재 위치를 확인할 수 없을 때 서울시청을 기본 위치로 사용합니다.
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      // 지도 확대 레벨을 5로 설정합니다.
      const map = new kakao.maps.Map(mapContainer, {
        center: defaultPosition,
        level: 5
      });

      // 장소 검색 서비스를 생성합니다.
      const places = new kakao.maps.services.Places();

      // 현재 표시 중인 마커와 말풍선을 저장합니다.
      let currentMarker = null;
      let currentInfoWindow = null;

      // 선택한 위치로 지도를 이동하고 마커를 표시합니다.
      function moveToPosition(latitude, longitude, placeName) {
        const position = new kakao.maps.LatLng(
          latitude,
          longitude
        );

        map.setCenter(position);
        map.setLevel(5);

        // 이전 마커와 말풍선을 제거합니다.
        if (currentMarker) {
          currentMarker.setMap(null);
        }

        if (currentInfoWindow) {
          currentInfoWindow.close();
        }

        // 새 위치에 마커를 표시합니다.
        currentMarker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        // 말풍선에 표시할 텍스트를 안전하게 생성합니다.
        const content = document.createElement("div");
        content.style.cssText =
          "padding:8px;font-size:13px;white-space:nowrap;";
        content.textContent = placeName;

        currentInfoWindow = new kakao.maps.InfoWindow({
          content: content
        });

        currentInfoWindow.open(map, currentMarker);
      }

      // 검색 결과 목록을 화면에 표시합니다.
      function displayResults(data) {
        resultsElement.replaceChildren();

        if (!data || data.length === 0) {
          statusElement.textContent = "검색 결과가 없습니다.";
          return;
        }

        statusElement.textContent =
          "검색 결과 " + data.length + "개";

        data.forEach(function (place) {
          const item = document.createElement("article");
          item.className = "result-item";
          item.tabIndex = 0;

          const name = document.createElement("h2");
          name.className = "place-name";
          name.textContent = place.place_name;

          const address = document.createElement("p");
          address.className = "place-address";
          address.textContent =
            place.road_address_name ||
            place.address_name ||
            "주소 정보 없음";

          const phone = document.createElement("p");
          phone.className = "place-phone";
          phone.textContent =
            place.phone || "전화번호 정보 없음";

          item.appendChild(name);
          item.appendChild(address);
          item.appendChild(phone);

          // 검색 결과를 클릭하면 해당 장소로 이동합니다.
          function selectPlace() {
            moveToPosition(
              Number(place.y),
              Number(place.x),
              place.place_name
            );

            statusElement.textContent =
              place.place_name + "을(를) 선택했습니다.";
          }

          item.addEventListener("click", selectPlace);

          // 키보드의 Enter 또는 Space 키로도 선택할 수 있습니다.
          item.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectPlace();
            }
          });

          resultsElement.appendChild(item);
        });
      }

      // 입력한 키워드로 장소를 검색합니다.
      function searchPlaces(keyword) {
        const searchKeyword = keyword.trim();

        if (!searchKeyword) {
          statusElement.textContent = "검색어를 입력해 주세요.";
          keywordInput.focus();
          return;
        }

        statusElement.textContent = "장소를 검색하고 있습니다.";
        resultsElement.replaceChildren();

        places.keywordSearch(
          searchKeyword,
          function (data, result) {
            if (result === kakao.maps.services.Status.OK) {
              displayResults(data);

              // 검색 결과가 모두 보이도록 지도 범위를 조절합니다.
              const bounds = new kakao.maps.LatLngBounds();

              data.forEach(function (place) {
                bounds.extend(
                  new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                  )
                );
              });

              map.setBounds(bounds);
            } else if (
              result === kakao.maps.services.Status.ZERO_RESULT
            ) {
              displayResults([]);
            } else {
              statusElement.textContent =
                "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
            }
          },
          {
            location: map.getCenter(),
            radius: 20000,
            size: 15
          }
        );
      }

      // 검색 버튼 또는 Enter 키로 검색합니다.
      searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        searchPlaces(keywordInput.value);
      });

      // 브라우저에서 현재 위치를 확인합니다.
      function getCurrentLocation() {
        if (!navigator.geolocation) {
          statusElement.textContent =
            "현재 브라우저에서는 위치 기능을 지원하지 않습니다.";
          return;
        }

        statusElement.textContent =
          "현재 위치를 확인하고 있습니다.";

        navigator.geolocation.getCurrentPosition(
          function (position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            moveToPosition(
              latitude,
              longitude,
              "현재 위치"
            );

            statusElement.textContent =
              "현재 위치를 지도에 표시했습니다.";
          },
          function (error) {
            // 위치 권한 거부 또는 확인 실패 시 안내합니다.
            if (error.code === error.PERMISSION_DENIED) {
              statusElement.textContent =
                "위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.";
            } else if (error.code === error.TIMEOUT) {
              statusElement.textContent =
                "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.";
            } else {
              statusElement.textContent =
                "현재 위치를 확인할 수 없습니다. 서울시청을 기본 위치로 표시합니다.";
            }
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }

      // 버튼을 클릭하면 현재 위치를 다시 확인합니다.
      locationButton.addEventListener(
        "click",
        getCurrentLocation
      );

      // 지도의 타일 로딩이 완료되면 화면 크기를 다시 계산합니다.
      kakao.maps.event.addListener(map, "tilesloaded", function () {
        map.relayout();
      });

      // 페이지가 처음 열리면 현재 위치를 확인합니다.
      getCurrentLocation();
    }
  </script>
</body>
</html>
